<footer class="site-footer">
  <div class="container">
    <nav class="footer-nav" aria-label="Footer">
      {% for column in footer %}
      <div class="footer-column">
        <h2 class="footer-heading">{{ column.title }}</h2>
        <ul>
          {% for link in column.links %}
          <li><a href="{{ link.url }}">{{ link.label }}</a></li>
          {% endfor %}
        </ul>
      </div>
      {% endfor %}
    </nav>
    <p class="footer-line">{{ site.name }} · Free and open source · Started at UIUC · <a href="/about/">About</a> · <a href="{{ site.source }}">Source on GitHub</a></p>
  </div>
</footer>
